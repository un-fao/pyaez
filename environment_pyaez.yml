name: pyaez

channels:
  - conda-forge

dependencies:
  - python=3.12

  # Core scientific computing
  - numpy
  - pandas
  - scipy
  - numba
  - psutil

  # Geospatial
  - geopandas
  - fiona
  - shapely
  - pyproj
  - rasterio
  - gdal

  # Raster / multidimensional data
  - xarray
  - netcdf4
  - h5py

  # Plotting
  - matplotlib

  # Excel / configuration
  - openpyxl
  - pyyaml

  # Statistics / analysis
  - scikit-learn
  - statsmodels

  # Jupyter
  - ipykernel
  - ipython
  - jupyterlab
  - notebook
  - ipywidgets
  - widgetsnbextension
  - jupyterlab_widgets

  # Utilities
  - tqdm
  - rapidfuzz

  - pip

  - pip:
      - cavapy
      - Levenshtein
